name: build

# Everything iOS needs a Mac except the engine proof: the corpus check
# compiles the pinned C sources for the host with the system compiler, while
# the app itself is built by xtool (SwiftPM, no Xcode) for the device triple.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned so a change upstream cannot silently alter what ships. Bump
  # deliberately: move the submodule, re-run tools/regen_generated.sh, record
  # a new corpus golden, and commit all three together.
  TVDECOMP_COMMIT: 79549473e10f5d4c58393acf24f116b8355e3585
  XTOOL_VERSION: 1.19.2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upstream is at the pinned commit
        run: |
          set -euo pipefail
          ACTUAL="$(git -C Vendor/upstream rev-parse HEAD)"
          test "$ACTUAL" = "$TVDECOMP_COMMIT" \
            || { echo "::error::Vendor/upstream is $ACTUAL, want $TVDECOMP_COMMIT"; exit 1; }
          echo "upstream at $ACTUAL"

      - name: Regen the voice data, check the struct header is current
        run: |
          set -euo pipefail
          # gen_data.py imports pefile (only used for its .exe path, but the
          # import is unconditional), so the regen needs it too.
          pip3 install --quiet --break-system-packages pefile
          # The data image is laid out using the host linker's object files,
          # so its bytes legitimately differ between Linux and macOS. It is
          # regenerated here for the build host, and the corpus check below
          # proves the result still speaks exactly the golden audio.
          # engine_struct.h, by contrast, comes only from engine.fields and
          # must be byte-identical everywhere: a diff here means the committed
          # generated files are stale.
          bash tools/regen_generated.sh
          git diff --exit-code -- Vendor/generated/engine_struct.h \
            || { echo "::error::engine_struct.h is stale; run tools/regen_generated.sh and commit"; exit 1; }
          echo "generated files are current"

      - name: Engine corpus check (host, no Xcode)
        run: |
          set -euo pipefail
          python3 tools/corpus_check.py

      - name: Core checks (SSML, parameters)
        run: |
          set -euo pipefail
          # Builds only CoreChecks and TruVoiceCore, never the C engine.
          swift run CoreChecks

      - name: Install xtool
        run: |
          set -euo pipefail
          brew install --quiet xtool-org/tap/xtool
          xtool --version

      - name: Build the app (device triple)
        run: |
          set -euo pipefail
          xtool dev build
          test -d xtool/*.app || { echo "::error::no .app was produced"; exit 1; }

      - name: Validate the app binary
        run: |
          set -euo pipefail
          APP_BIN="$(find xtool -maxdepth 3 -name iTruVoice -type f | head -1)"
          test -n "$APP_BIN" || { echo "::error::no app binary found"; exit 1; }
          echo "binary: $APP_BIN"
          # The platform must be iOS (device), not simulator or macOS.
          otool -l "$APP_BIN" | grep -q 'platform 2' \
            || { echo "::error::binary is not an iOS device binary"; exit 1; }
          file "$APP_BIN" | grep -q 'arm64' \
            || { echo "::error::binary is not arm64"; exit 1; }
          # The engine made it into the link.
          nm "$APP_BIN" | grep -q 'tvtts_speak_utf8' \
            || { echo "::error::engine symbols missing from the app"; exit 1; }
          # The provider extension rode along.
          test -d xtool/*.app/PlugIns/TruVoiceProvider.appex \
            || { echo "::error::provider extension not embedded"; exit 1; }
          # The extension must be installable: xtool does not substitute
          # variables in an extension's plist, so a raw $(...) identifier
          # ships and installation fails with "not part of the main app
          # bundle identifier". Literal IDs, prefixed by the app's.
          APPEX_PLIST="$(echo xtool/*.app/PlugIns/TruVoiceProvider.appex/Info.plist)"
          APP_PLIST="$(echo xtool/*.app/Info.plist)"
          if grep -q '\$(' "$APPEX_PLIST"; then
            echo "::error::extension plist contains unsubstituted variables"
            exit 1
          fi
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PLIST")"
          EXT_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APPEX_PLIST")"
          case "$EXT_ID" in
            "$APP_ID".*) echo "extension $EXT_ID lives under app $APP_ID" ;;
            *) echo "::error::extension $EXT_ID is not under app $APP_ID"; exit 1 ;;
          esac
          echo "app binary is arm64 iOS with the engine linked and the provider embedded"
